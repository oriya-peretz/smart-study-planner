[project]
name = "smart-study-planner-frontend"
version = "0.1.0"
description = "Smart Study Planner - browser frontend"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
