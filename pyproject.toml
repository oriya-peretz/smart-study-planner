[project]
name = "smart-study-planner"
version = "0.1.0"
description = "Smart Study Planner - plan courses, tasks and exams"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
